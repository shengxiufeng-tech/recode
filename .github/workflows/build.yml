name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install desktop FFmpeg (used to run every generated command)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Unit tests + real FFmpeg command checks
        env:
          FFMPEG_BIN: /usr/bin/ffmpeg
          FFPROBE_BIN: /usr/bin/ffprobe
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release signing key (optional)
        env:
          KS: ${{ secrets.RECODE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RECODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECODE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RECODE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RECODE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "RECODE_KEYSTORE_PASSWORD=$KS_PASS"
              echo "RECODE_KEY_ALIAS=$KEY_ALIAS"
              echo "RECODE_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Using release key from secrets"
          else
            echo "No release key secret; release APK is signed with the repo debug key"
          fi

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Collect APKs
        id: apk
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Recode-${VERSION}.apk"
          # Debuggable build (package app.recode.debug), installs alongside the normal one; for troubleshooting.
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Recode-${VERSION}-debug.apk"
          ls -la dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Installs the real APK on an Android emulator and transcodes a clip through the app.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make test clip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -y -f lavfi -i testsrc2=size=640x360:rate=30:duration=3 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=3 \
            -c:v libx264 -preset ultrafast -g 30 -pix_fmt yuv420p -c:a aac -ac 2 smoke.mp4

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-out/
          if-no-files-found: ignore

  # The emulator runs the arm64 FFmpeg through binary translation, so it isn't (yet) a reliable
  # gate; releases depend on the unit + real-FFmpeg tests, the smoke test is informational.
  release:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Recode ${{ needs.build.outputs.version }}
          body: |
            Automatic build from ${{ github.sha }}. Passed unit tests and real-FFmpeg command checks.
            Download Recode-*.apk below and open it on your phone to install or update.
            The -debug.apk is a debuggable build for troubleshooting (installs separately, package app.recode.debug).
          files: dist/*.apk
          make_latest: true
